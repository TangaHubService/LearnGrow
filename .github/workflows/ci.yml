name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kuralearn_test
          POSTGRES_USER: kuralearn
          POSTGRES_PASSWORD: kuralearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: KuraLearn-bn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: KuraLearn-bn/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://kuralearn:kuralearn@localhost:5432/kuralearn_test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://kuralearn:kuralearn@localhost:5432/kuralearn_test
      - run: npm test
        env:
          DATABASE_URL: postgresql://kuralearn:kuralearn@localhost:5432/kuralearn_test
          JWT_SECRET: test-secret-key-at-least-24-chars-long

  frontend:
    name: Frontend — Lint, Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KuraLearn-fn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: KuraLearn-fn/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          VITE_API_URL: http://localhost:4000/api/v1
